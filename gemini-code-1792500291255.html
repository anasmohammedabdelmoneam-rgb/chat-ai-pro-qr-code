    <div id="app-splash" aria-hidden="true"><img src="./icon-512.png?v=1792436836623" alt="" /></div>
    <style>
        #app-splash {
            position: fixed;
            inset: 0;
            z-index: 2147483600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            transition: opacity .4s ease

        #app-splash.hide {
            opacity: 0;

        }

        #app-splash img {
            width: 28vmin;
            height: 28vmin;
            border-radius: 22.37%;
            display: block
        }
    </style>
    <script>
        setTimeout(function() {
            var e = document.getElementById('app-splash');
            if (!e) return;
            var r = document.getElementById('root');
            if (r && r.childElementCount > 0) {
                e.classList.add('hide');
                setTimeout(function() {
                    e.remove()
                }, 450);
                return
            }
            var b = document.createElement('button');
            b.type = 'button';
            b.style.cssText = 'margin-top:28px;padding:12px 22px;border:none;border-radius:12px;background:rgba(255,255,255,0.94);color:#1a1a1a;font:600 14px/1.6 system-ui,-apple-system,sans-serif;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.18);text-align:center';
            b.appendChild(document.createTextNode('Something went wrong \u2014 tap to retry'));
            b.appendChild(document.createElement('br'));
            b.appendChild(document.createTextNode('\u062d\u062f\u062b \u062e\u0637\u0623 \u0645\u0627 \u2014 \u0627\u0636\u063a\u0637 \u0644\u0625\u0639\u0627\u062f\u0629 \u0627\u064 فإن \u0645\u062d\u0627\u0648\u0644\u0629'));
            b.addEventListener('click', function() {
                location.reload()
            });
            e.removeAttribute('aria-hidden');
            e.appendChild(b)
        }, 8000)
    </script>

        <div id="root"></div>
    </div>
