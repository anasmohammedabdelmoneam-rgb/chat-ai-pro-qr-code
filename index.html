<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Chat AI Pro | QR Code</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#101827;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding:24px}
.card{width:min(100%,560px);background:#fff;border:1px solid #e5eaf2;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 70px #0a1c3510}
.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#41c9ff,#3159f5);display:grid;place-items:center;color:white;font-size:25px;font-weight:800;box-shadow:0 8px 20px #356cf533}
h1{font-size:22px;margin:0}.sub{margin:8px 0 22px;color:#64748b;font-size:14px}
.qr{width:min(100%,390px);height:auto;display:block;margin:0 auto 20px;image-rendering:pixelated}
.link{direction:ltr;overflow-wrap:anywhere;color:#2864dd;font-size:13px;margin:0 auto 20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}a.btn,button.btn{border:0;border-radius:12px;padding:12px 18px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#2463eb;color:white}.secondary{background:#eef3fb;color:#24354f}.note{font-size:11px;color:#8490a4;margin-top:18px}
</style>
</head>
<body>
<main class="card">
 <div class="brand"><div class="logo">✦</div><h1>Chat AI Pro</h1></div>
 <p class="sub">امسح رمز QR لفتح التطبيق</p>
 <img class="qr" src="https://i.postimg.cc/nLVspSQR/8807de72266ab6e49035015890c5d040.png" alt="QR Code يفتح Chat AI Pro">
 <p class="link">https://chat-ai-pro-ymod.onrender.com/</p>
 <div class="actions">
  <a class="btn primary" href="https://chat-ai-pro-ymod.onrender.com/" target="_blank" rel="noopener">فتح التطبيق ↗</a>
  <a class="btn secondary" href="chat-ai-pro-qr.png" download="Chat-AI-Pro-QR.png">تنزيل QR Code ↓</a>
 </div>
 <p class="note">رمز QR مرتبط برابط تطبيق Chat AI Pro.</p>
</main>
</body>
</html>
